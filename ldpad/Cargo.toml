[package]
name = "ldpad"
version = "0.1.0"
edition = "2021"
description = "Lightweight Dynamic Posture and Anomaly Detection Framework (LDPAD)"
authors = ["Semunyu Aloyzious <semunyu.aloyzious@students.mak.ac.ug>", "Odoi Stephen <odoi.stephen@students.mak.ac.ug>"]

[lib]
name = "ldpad"
path = "src/lib.rs"

[[bin]]
name = "ldpad"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rand_distr = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
regorus = { version = "0.14", default-features = false, features = ["std", "arc"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "evaluate_tick_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
