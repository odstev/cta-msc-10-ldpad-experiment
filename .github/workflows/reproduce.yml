name: Rebuild archived experiment results

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt

      - name: Reproduce archived results
        run: make reproduce

      - name: Save rebuilt results
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-results
          path: evidence_outputs/
