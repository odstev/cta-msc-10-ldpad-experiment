apiVersion: v1
kind: Pod
metadata:
  name: ldpad-persistent
spec:
  containers:
    - name: ldpad
      image: ubuntu:24.04
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: ldpad-file
          mountPath: /usr/local/bin/ldpad
          readOnly: true
  volumes:
    - name: ldpad-file
      hostPath:
        path: /home/user/k3s-transfer/ldpad
        type: File
